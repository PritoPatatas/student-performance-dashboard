<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Student Performance Dashboard</h1>
  </header>

  <main class="dashboard">
    <section class="controls" aria-label="Search and filter controls">
      <div class="control-group">
        <label for="searchInput">Search</label>
        <input
          type="text"
          id="searchInput"
          placeholder="Enter student name"
        />
      </div>

      <div class="control-group">
        <label for="blockFilter">Block</label>
        <select id="blockFilter">
          <option value="All">All</option>
          <option value="31-ITE-01">31-ITE-01</option>
          <option value="31-ITE-02">31-ITE-02</option>
          <option value="31-ITE-03">31-ITE-03</option>
        </select>
      </div>

      <div class="control-group">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="All">All</option>
          <option value="Excellent">Excellent</option>
          <option value="Passed">Passed</option>
          <option value="Needs Improvement">Needs Improvement</option>
          <option value="Failed">Failed</option>
        </select>
      </div>

      <div class="control-group buttons">
        <button id="applyBtn" type="button">Apply Filters</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </section>

    <section class="summary" aria-label="Class summary">
      <div class="summary-card">
        <span class="summary-label">Displayed Students</span>
        <span id="displayedCount" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Class Average</span>
        <span id="classAverage" class="summary-value">0.00</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Passing Students</span>
        <span id="passingCount" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Top Student</span>
        <span id="topStudent" class="summary-value">—</span>
      </div>
    </section>
    <div id="messageArea" class="message-area"></div>
    <section id="studentList" class="student-list" aria-label="Student records">
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
